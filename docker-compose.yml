services:
  db:
    image: postgres:16-alpine
    container_name: tcg_db
    environment:
      POSTGRES_DB: tcg
      POSTGRES_USER: tcg_user
      POSTGRES_PASSWORD: tcg_password
    ports:
      - "5432:5432"
    volumes:
      - tcg_postgres_data:/var/lib/postgresql/data

  backend:
    image: python:3.12-slim
    container_name: tcg_backend
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -e . && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://tcg_user:tcg_password@db:5432/tcg
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    image: node:22-alpine
    container_name: tcg_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  tcg_postgres_data:
